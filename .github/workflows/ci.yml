name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lenso_email
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lenso_email"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0 # v4
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check package
        run: pnpm check
      - name: Check Postgres durability
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lenso_email
        run: pnpm test:integration
      - name: Verify package and Service contract
        run: pnpm package-readiness
      - name: Build container
        run: docker build -t lenso-email-provider-service:ci .
