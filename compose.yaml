services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lenso_email
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenso_email"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "5442:5432"
    volumes:
      - lenso-email-postgres:/var/lib/postgresql/data

volumes:
  lenso-email-postgres:
